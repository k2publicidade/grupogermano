<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="350 300 900 260" preserveAspectRatio="xMidYMid meet">
  <title>Germano — Logo oficial animado, reprodução única</title>
  <desc>Intro animada com fundo transparente: marca gira/entra, letras se montam em sequência e um brilho de luz percorre a marca em loop.</desc>

  <defs>
    <style>
      .st0 { fill:#1d1d1b; }

      .icon-mark, .letter, .energy-ring, .guide-line { transform-box: fill-box; transform-origin: 50% 50%; }

      /* ---------- linha-guia central (chega antes da marca) ---------- */
      @keyframes guideIn {
        0%   { transform: scaleX(0);   opacity: 0; }
        42%  { transform: scaleX(1);   opacity: .55; }
        72%  { transform: scaleX(1);   opacity: .55; }
        100% { transform: scaleX(1);   opacity: 0; }
      }
      .guide-line { animation: guideIn 1.1s ease-out .15s both; }

      /* ---------- sombra de contato sutil (neutra) ---------- */
      @keyframes fadeShadow { from{opacity:0;} to{opacity:.10;} }
      .contact-shadow { animation: fadeShadow 1s ease-out .4s both; }

      /* ---------- anel de energia atrás do ícone ---------- */
      @keyframes ringPulse {
        0%   { transform: scale(.2);  opacity: .55; }
        100% { transform: scale(3.4); opacity: 0; }
      }
      .energy-ring { animation: ringPulse .9s cubic-bezier(.16,1,.3,1) .5s both; }

      /* ---------- marca/ícone (entrada com leve overshoot) ---------- */
      @keyframes iconIn {
        from { opacity: 0; transform: translateY(14px) scale(.4) rotate(-24deg); filter: blur(6px); }
        to   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg);       filter: blur(0);   }
      }
      .icon-mark { animation: iconIn .85s cubic-bezier(.34,1.56,.64,1) .5s both; }

      /* ---------- letras: convergem lateralmente + sobem + focam ---------- */
      @keyframes letterIn {
        from { opacity: 0; transform: translate(calc(var(--tx) * 1px), 26px) scale(.85); filter: blur(4px); }
        to   { opacity: 1; transform: translate(0,0) scale(1);                            filter: blur(0);   }
      }
      .letter { animation: letterIn .65s cubic-bezier(.16,1,.3,1) both; }
    </style>

    <!-- faixa de brilho que varre a wordmark -->
    <linearGradient id="shineGrad" gradientUnits="userSpaceOnUse" x1="-520" y1="-40" x2="-360" y2="140">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform id="shineLoop" attributeName="gradientTransform" type="translate"
        from="0 0" to="950 0" begin="2.3s" dur="1.1s"
        fill="freeze" calcMode="spline" keySplines=".4 0 .2 1" keyTimes="0;1"/>
    </linearGradient>

    <!-- glow suave para o ícone -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- fundo transparente propositalmente (sem rect de background) -->

  <!-- sombra de contato sutil e neutra -->
  <ellipse class="contact-shadow" cx="800" cy="620" rx="360" ry="26" fill="#000000" opacity="0" filter="url(#bigBlur)"/>

  <!-- linha-guia central (tom neutro, sem dourado) -->
  <line class="guide-line" x1="480" y1="450" x2="1120" y2="450" stroke="#1d1d1b" stroke-width="1.5" opacity="0"/>

  <!-- ===================== LOGO ===================== -->
  <g transform="translate(360,340) scale(2.2)">

    <!-- anel de energia atrás do ícone -->
    <circle class="energy-ring" cx="33" cy="42" r="10" fill="none" stroke="#1d1d1b" stroke-width="1" opacity="0"/>

    <!-- ícone / marca (representa o "G") -->
    <g class="icon-mark" filter="url(#softGlow)" opacity="0">
      <path id="mkIcon" class="st0" d="M34.87,43.38c-.57.51-.68,1.19-.76,1.9-.21,1.81-.22,11.83.3,13.03.12.28.9,1.24,1.05,1.24h7.43c-7.18,7.67-20.2,3.14-23.27-6.26-4.07-12.47,8.57-25.28,20.71-18.39,1.37.78,3.76,3.34,5.2,2.78,2-2.03,11.88-7.01,12.8-8.95.7-1.49-2.47-4.14-3.62-5.13C32.67,4.71-.89,21.56,1.39,50.57c1.58,20.17,19.06,32.99,38.83,28.96,1.58-.32,4.81-1.67,5.94-1.71.93-.03,1.6.68,2.62.76,1.66.14,11.91.19,12.77-.21.18-.08.77-.69.77-.76v-34.04l-27.45-.19ZM57.37,45.1c-2.32,1.84-5.93,5.82-9.02,3.87l-7.75-3.87h16.77ZM52.79,61.84l-5.31-3.65,2.83-4.33c.42-.02,2.73,7.65,2.47,7.98ZM36.4,45.86c1.3.89,11.26,4.54,11.44,5.14.19.65-1.53,1.16-2.03,1.39-3.1,1.44-6.21,2.9-9.4,4.12v-10.65ZM40.6,57.27l6.48-3.04c-.91,3.5-3.46,3.22-6.48,3.04ZM46.13,60.06l4.76,3.3h-8.77l4.01-3.3ZM34.49,65.64c.03,2.96.73,5.24-2.92,3.48-1.42-.68-11.71-6.83-12.3-7.5-1.09-1.24-2.56-5.23-.79-6.26,2.48,6.58,9.12,10.24,16.01,10.27ZM28.78,31.4c.57-.86,3.23-4.41,3.81-4.77.14-.09,3.2.21,3.35.29.44.24,2.69,4.23,3.51,4.86-3.46-.96-7.15-1.05-10.67-.38ZM41.83,18.93c4.02.55,9.76,4.97,12.87,7.53l-16.49-3.42c-1.58-.67,1.24-4.43,3.62-4.11ZM38.61,25.19c3.12.27,12.2,2.16,15.12,3.19.41.14.91.19.97.74l-9.66,6.03c-.91-1.14-7.6-9.04-7.49-9.64.13-.69.73-.36,1.06-.33ZM22.68,19.81c4.12-1.98,10.43-2.57,14.86-1.71-.59,2.7-2.26,1.72-3.73,2.13-1.16.33-1.71,1.59-2.56,1.67l-9.71-1.15c.1-.57.7-.73,1.14-.95ZM28.15,23.47c.62.1,3.18.32,3.3.9l-9.53,11.41c-.64.32-6.64-.67-7.16-1.04-.33-.23-.36-1.04-.3-1.46.5-3.26,3.04-7.57,3.68-10.99,3.3.51,6.71.63,10.01,1.16ZM15.05,24.18c-.84,2.34-1.57,6.89-2.74,8.86-.84,1.43-2.49,1.31-2,4.47l-7.07,11.39c-.02-9.45,4.15-19.1,11.81-24.72ZM4.01,54.99c.58-.14.83.23,1.25.46,1.22.64,8.32,5,8.82,5.66,2.02,2.65,1.49,8.09,1.74,11.38-5.98-4.05-10.1-10.48-11.81-17.5ZM16.58,50.61c-.13,2.72-1.01,5.79-1.14,8.56l-11.42-7.03,8.57-14.27c1.26,4.27,4.21,8.2,3.99,12.74ZM16.97,43.57l-2.29-6.46,4.95.76c.12.17-.97,2.68-1.2,3.18-.33.73-.84,2.08-1.47,2.52ZM17.35,63.36l14.48,8.74-13.72,1.53-.76-10.27ZM43.08,76.67c-5.57,1.87-12.35,2.09-18.02.47-1.28-.37-3.14-.85-3.9-2,.82-.05,1.66.08,2.47,0,2.31-.25,6.34-1.28,8.39-1.17,1.14.06,1.67,1.07,2.7,1.18,1.25.13,2.02-.81,3.38-.78,1.82.04,4.4,1.33,6.31,1.54.06.55-.9.62-1.32.76ZM47.67,74.03c-1.41,1.04-7.37-1.61-9.36-1.74-.07-.84-1.71-2.72-1.75-3.02-.13-.87.55-2.87.22-4.01l14.68.38c.6,0,1.23.81,1.2,1.33-.03.43-4.64,6.8-4.99,7.06ZM48.98,76.29l5.53-8.37c.52-.11.65.3.89.63,1.5,2.04,2.83,5.38,3.87,7.74h-10.29ZM60.42,72.87c-.63-.57-3.32-5.19-3.32-5.52,0-.25.81-.94.96-1.6.21-.9-.13-1.9.27-2.77l2.09-1.91v11.79ZM60.42,56.7c0,.48-3.73,5.76-4.97,4.97-.84-.54-2.62-8.4-3.35-9.86l.72-.78,7.6-4.78v10.46Z"/>
    </g>

    <!-- E -->
    <g class="letter" style="--tx:-45; animation-delay:.90s;" opacity="0">
      <polygon id="ltE" class="st0" points="105.01 31.79 105.01 44.34 82.52 44.34 82.52 49.66 104.63 49.66 104.63 61.07 82.52 61.07 82.52 66.4 106.15 66.4 105.39 78.95 66.9 78.95 66.9 31.79 105.01 31.79"/>
    </g>

    <!-- R -->
    <g class="letter" style="--tx:-26; animation-delay:.99s;" opacity="0">
      <path id="ltR" class="st0" d="M142.73,63.56c12.85-4.91,13.94-24.22,1.29-30.2-1.12-.53-3.36-1.43-4.52-1.58h-30.3v47.17h15.63v-13.69c4.45,4.11,7.76,9.35,12.01,13.69h18.49l-12.59-15.39ZM136.98,50.95c-.3.58-2.34,2.14-2.81,2.14h-9.34v-8.75h9.34c.35,0,2.62,1.62,2.88,2.07.65,1.14.54,3.36-.07,4.54Z"/>
    </g>

    <!-- M -->
    <g class="letter" style="--tx:-4; animation-delay:1.08s;" opacity="0">
      <path id="ltM" class="st0" d="M198.01,31.79h17.53v47.17h-15.25v-18.26l-8.44,18.21c-3.04-.18-6.73.42-9.69.07-.55-.06-1-.04-1.27-.63l-8.42-18.03v18.64h-15.25V31.79h17.34l11.82,22.05,11.63-22.05Z"/>
    </g>

    <!-- A -->
    <g class="letter" style="--tx:19; animation-delay:1.17s;" opacity="0">
      <path id="ltA" class="st0" d="M253.99,31.84l-17.69-.08-18.85,47.19h16.58l2.35-5.72c2.16.33,16.83-.47,17.32.24.81,1.16.84,4.26,2.05,5.48h16.58l-18.35-47.11ZM240.7,60.69c1.16-3.6,2.24-8.24,3.8-11.62.17-.38.23-.89.77-.94l3.82,12.55h-8.39Z"/>
    </g>

    <!-- N -->
    <g class="letter" style="--tx:39; animation-delay:1.26s;" opacity="0">
      <path id="ltN" class="st0" d="M306.26,53.47v-21.68h15.63v47.17h-12.77l-19.25-20.92v20.92h-16.01V31.79h13.15c6.36,7.26,12.51,14.8,19.25,21.68Z"/>
    </g>

    <!-- O -->
    <g class="letter" style="--tx:62; animation-delay:1.35s;" opacity="0">
      <path id="ltO" class="st0" d="M347.73,30.76c-17.9,1.82-28.43,22.88-18.15,38.05,12.08,17.83,42.19,13.75,47-7.35,4.23-18.52-10.64-32.55-28.86-30.7ZM351.43,66.4c-13.21-.09-13.45-21.6-.28-21.95,13.79-.37,13.68,22.05.28,21.95Z"/>
    </g>

    <!-- ® -->
    <g class="letter" style="--tx:77; animation-delay:1.55s;" opacity="0">
      <path id="tmR1" class="st0" d="M389.63,35.3c-9.22,1.59-7.47,16.85,3.25,15.03,9.28-1.58,7.51-16.88-3.25-15.03ZM391.41,48.49c-6.9.15-7.84-10.5-.62-11.31,7.37-.83,8.27,11.14.62,11.31Z"/>
      <path id="tmR2" class="st0" d="M393.96,42.25c.37-3.45-2.97-2.92-5.37-2.86v6.85c0,.08,1.25-.05,1.52,0,.17-.74-.53-1.95.58-1.91,1.73.06,1.59,2.64,4,1.91-2.28-2.14-.92-2.19-.73-3.98ZM392.4,42.82h-2.29v-1.91h2.29v1.91Z"/>
    </g>

    <!-- camada de brilho que varre a wordmark (loop contínuo a cada ~5.6s) -->
    <g style="mix-blend-mode:screen; opacity:.9;">
      <use href="#mkIcon" style="fill:url(#shineGrad) !important;"/>
      <use href="#ltE"    style="fill:url(#shineGrad) !important;"/>
      <use href="#ltR"    style="fill:url(#shineGrad) !important;"/>
      <use href="#ltM"    style="fill:url(#shineGrad) !important;"/>
      <use href="#ltA"    style="fill:url(#shineGrad) !important;"/>
      <use href="#ltN"    style="fill:url(#shineGrad) !important;"/>
      <use href="#ltO"    style="fill:url(#shineGrad) !important;"/>
      <use href="#tmR1"   style="fill:url(#shineGrad) !important;"/>
      <use href="#tmR2"   style="fill:url(#shineGrad) !important;"/>
    </g>
  </g>

</svg>
